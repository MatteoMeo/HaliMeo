name: Build HaliMeo debug APK

on:
  push:
    branches:
      - feature/ui-ux-refresh
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/scripts/**'
      - 'gradlew'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

# La chiave di firma persistente è già stata salvata: solo la build più recente
# deve occupare il runner, così le modifiche successive non restano in coda.
concurrency:
  group: halimeo-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Compila e pubblica APK Alpha
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice sorgente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configura Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Firma di rilascio permanente. La chiave privata arriva esclusivamente
      # da GitHub Actions Secrets: non viene mai salvata nel repository o in cache.
      - name: Prepara e verifica la chiave permanente HaliMeo
        env:
          HALIMEO_SIGNING_KEYSTORE_BASE64: ${{ secrets.HALIMEO_SIGNING_KEYSTORE_BASE64 }}
          HALIMEO_SIGNING_STORE_PASSWORD: ${{ secrets.HALIMEO_SIGNING_STORE_PASSWORD }}
          HALIMEO_SIGNING_KEY_PASSWORD: ${{ secrets.HALIMEO_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/halimeo-alpha-release.jks"
          mkdir -p "$HOME/.android"
          if [ -z "${HALIMEO_SIGNING_KEYSTORE_BASE64:-}" ] || [ -z "${HALIMEO_SIGNING_STORE_PASSWORD:-}" ] || [ -z "${HALIMEO_SIGNING_KEY_PASSWORD:-}" ]; then
            echo "::error::Configura i GitHub Actions Secrets HALIMEO_SIGNING_KEYSTORE_BASE64, HALIMEO_SIGNING_STORE_PASSWORD e HALIMEO_SIGNING_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$HALIMEO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$HALIMEO_SIGNING_STORE_PASSWORD" -alias halimeo-alpha >/dev/null
          FINGERPRINT="$(keytool -exportcert -alias halimeo-alpha -keystore "$KEYSTORE" -storepass "$HALIMEO_SIGNING_STORE_PASSWORD" | sha256sum | awk '{print $1}')"
          EXPECTED="116c6d8173c20696d4a0d13d01e2a469aee068f26d3ede8a6ddd77efe1c573df"
          echo "Impronta SHA-256 chiave permanente HaliMeo: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Keystore non valido: l'impronta non corrisponde alla chiave permanente HaliMeo."
            exit 1
          fi
          echo "HALIMEO_SIGNING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "HALIMEO_SIGNING_CERT_SHA256=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ripristina la cache di compilazione Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-halimeo-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-halimeo-gradle-build-cache-

      - name: Compila APK debug
        env:
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew --build-cache --parallel -PHALIMEO_VERSION_CODE="$HALIMEO_VERSION_CODE" -PHALIMEO_VERSION_NAME="$HALIMEO_VERSION_NAME" assembleDebug

      - name: Verifica la firma e prepara l'APK versionato
        env:
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
          HALIMEO_SIGNING_STORE_PASSWORD: ${{ secrets.HALIMEO_SIGNING_STORE_PASSWORD }}
          HALIMEO_SIGNING_KEY_PASSWORD: ${{ secrets.HALIMEO_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK/build-tools non trovato."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner non trovato negli Android Build Tools."
            exit 1
          fi
          # Firma esplicitamente l’APK con la chiave persistente: Gradle può usare una
          # debug.keystore diversa da quella generata/restaurata in questo workflow.
          SIGNED_APK="${APK%.apk}-alpha-signed.apk"
          "$APKSIGNER" sign --ks "$HALIMEO_SIGNING_KEYSTORE_PATH" \
            --ks-key-alias halimeo-alpha \
            --ks-pass env:HALIMEO_SIGNING_STORE_PASSWORD --key-pass env:HALIMEO_SIGNING_KEY_PASSWORD \
            --out "$SIGNED_APK" "$APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          APK_CERT_INFO="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" 2>&1)"
          echo "$APK_CERT_INFO"
          APK_CERT_SHA256="$(printf '%s\n' "$APK_CERT_INFO" | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="$(printf '%s' "$HALIMEO_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::La firma dell’APK non corrisponde alla chiave Alpha persistente. Pubblicazione annullata."
            echo "Attesa: $EXPECTED_SHA256"
            echo "APK:     $APK_CERT_SHA256"
            exit 1
          fi
          cp "$SIGNED_APK" "HaliMeo-${HALIMEO_VERSION_NAME}-build${HALIMEO_VERSION_CODE}-debug.apk"
          echo "Firma verificata: l’APK usa la chiave Alpha persistente."

      - name: Individua l'ultimo APK Alpha pubblicato con successo
        id: previous-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-debug-apk.yml/runs?branch=${CURRENT_BRANCH}&status=success&per_page=100")"
          PREVIOUS_SHA="$(printf '%s' "$RUNS" | jq -r --arg id "$CURRENT_RUN_ID" \
            '[.workflow_runs[] | select((.id | tostring) != $id and .conclusion == "success" and .head_branch == env.CURRENT_BRANCH)] | sort_by(.run_number) | last | .head_sha // empty')"
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
            echo "Changelog dal precedente APK riuscito: $PREVIOUS_SHA"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Nessun APK precedente riuscito trovato: verrà usato il fallback Git."
          fi

      - name: Genera il changelog in italiano dalle modifiche reali
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PREVIOUS_BUILD_SHA: ${{ steps.previous-build.outputs.sha }}
          CURRENT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_CHANNEL: Alpha
        run: python3 .github/scripts/generate_changelog.py

      - name: Carica gli artefatti della build
        uses: actions/upload-artifact@v4
        with:
          name: halimeo-${{ github.run_number }}-debug-apk
          path: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14

      - name: Pubblica la release Alpha dedicata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-build-${{ github.run_number }}
          name: HaliMeo Alpha ${{ github.run_number }} · v1.0.${{ github.run_number }}
          body_path: CHANGELOG.md
          prerelease: true
          make_latest: false
          files: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
