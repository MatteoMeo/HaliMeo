name: Build HaliMeo debug APK

on:
  push:
    branches:
      - feature/ui-ux-refresh
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

concurrency:
  group: halimeo-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compile and publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep Android's debug signing key between CI runs. Without this cache,
      # each fresh runner creates a different key and Android rejects updates
      # over the previously installed APK as a signature mismatch.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: halimeo-debug-signing-key-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Gradle task output cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-halimeo-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-halimeo-gradle-build-cache-

      - name: Build debug APK
        env:
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew --build-cache --parallel -PHALIMEO_VERSION_CODE="$HALIMEO_VERSION_CODE" -PHALIMEO_VERSION_NAME="$HALIMEO_VERSION_NAME" assembleDebug

      - name: Prepare versioned APK
        env:
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "HaliMeo-${HALIMEO_VERSION_NAME}-build${HALIMEO_VERSION_CODE}-debug.apk"

      - name: Generate changelog
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          {
            echo "# HaliMeo Alpha ${VERSION_NAME} (build ${BUILD_NUMBER})"
            echo
            echo "- Branch: `feature/ui-ux-refresh`"
            echo "- Commit: `${CURRENT_SHA:0:7}`"
            echo
            echo "## Changelog"
            echo
            if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git log --format='- %s (`%h`)' "${BEFORE_SHA}..${CURRENT_SHA}"
            else
              git log -1 --format='- %s (`%h`)' "${CURRENT_SHA}"
            fi
            echo
            echo "## Download"
            echo
            echo "- `HaliMeo-${VERSION_NAME}-build${BUILD_NUMBER}-debug.apk`"
            echo
            echo "Pre-release alpha build for testing. It may contain bugs."
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halimeo-${{ github.run_number }}-debug-apk
          path: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish standalone alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-build-${{ github.run_number }}
          name: HaliMeo Alpha 1.0.${{ github.run_number }} (build ${{ github.run_number }})
          body_path: CHANGELOG.md
          prerelease: true
          make_latest: false
          files: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
