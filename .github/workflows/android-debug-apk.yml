name: Build HaliMeo debug APK

on:
  push:
    branches:
      - feature/ui-ux-refresh
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

# La chiave di firma persistente è già stata salvata: solo la build più recente
# deve occupare il runner, così le modifiche successive non restano in coda.
concurrency:
  group: halimeo-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compila e pubblica APK Alpha
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice sorgente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configura Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # La chiave Alpha 350 è l'unica identità di firma ammessa.
      # La cache è solo un acceleratore: la chiave originale deve essere fornita
      # tramite secret permanente, perché le cache GitHub possono scadere.
      - name: Ripristina la chiave di firma Alpha 350
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: halimeo-debug-signing-key-v2

      - name: Verifica la chiave originale Alpha 350
        env:
          HALIMEO_SIGNING_KEYSTORE_BASE64: ${{ secrets.HALIMEO_SIGNING_KEYSTORE_BASE64 }}
          HALIMEO_SIGNING_STORE_PASSWORD: ${{ secrets.HALIMEO_SIGNING_STORE_PASSWORD }}
          HALIMEO_SIGNING_KEY_PASSWORD: ${{ secrets.HALIMEO_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"

          # Il secret è la fonte permanente. Sovrascrive qualsiasi cache obsoleta.
          if [ -n "${HALIMEO_SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$HALIMEO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Chiave Alpha 350 non disponibile. Non genero una nuova firma: aggiungi il keystore originale come secret HALIMEO_SIGNING_KEYSTORE_BASE64."
            exit 1
          fi

          STORE_PASSWORD="${HALIMEO_SIGNING_STORE_PASSWORD:-android}"
          KEY_PASSWORD="${HALIMEO_SIGNING_KEY_PASSWORD:-android}"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias androiddebugkey >/dev/null
          FINGERPRINT="$(keytool -exportcert -alias androiddebugkey -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" | sha256sum | awk '{print $1}')"
          EXPECTED="7b9f40b22e05a07232fbb787a4ab27efb5ba264d5a660af7df999fd2f3aa94c8"
          echo "Impronta SHA-256 chiave Alpha: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Firma incompatibile: serve esattamente il certificato Alpha 350 ($EXPECTED)."
            exit 1
          fi
          echo "HALIMEO_SIGNING_CERT_SHA256=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "HALIMEO_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HALIMEO_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # Se il secret permanente è presente, salva anche una cache di riserva.
      - name: Salva la chiave Alpha 350 in cache
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: halimeo-debug-signing-key-v2

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ripristina la cache di compilazione Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-halimeo-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-halimeo-gradle-build-cache-

      - name: Compila APK debug
        env:
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew --build-cache --parallel -PHALIMEO_VERSION_CODE="$HALIMEO_VERSION_CODE" -PHALIMEO_VERSION_NAME="$HALIMEO_VERSION_NAME" assembleDebug

      - name: Verifica la firma e prepara l'APK versionato
        env:
          HALIMEO_VERSION_NAME: 1.0.${{ github.run_number }}
          HALIMEO_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK/build-tools non trovato."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner non trovato negli Android Build Tools."
            exit 1
          fi
          # Firma esplicitamente l’APK con la chiave persistente: Gradle può usare una
          # debug.keystore diversa da quella generata/restaurata in questo workflow.
          SIGNED_APK="${APK%.apk}-alpha-signed.apk"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:$HALIMEO_SIGNING_STORE_PASSWORD --key-pass pass:$HALIMEO_SIGNING_KEY_PASSWORD \
            --out "$SIGNED_APK" "$APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          APK_CERT_INFO="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" 2>&1)"
          echo "$APK_CERT_INFO"
          APK_CERT_SHA256="$(printf '%s\n' "$APK_CERT_INFO" | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="$(printf '%s' "$HALIMEO_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::La firma dell’APK non corrisponde alla chiave Alpha persistente. Pubblicazione annullata."
            echo "Attesa: $EXPECTED_SHA256"
            echo "APK:     $APK_CERT_SHA256"
            exit 1
          fi
          cp "$SIGNED_APK" "HaliMeo-${HALIMEO_VERSION_NAME}-build${HALIMEO_VERSION_CODE}-debug.apk"
          echo "Firma verificata: l’APK usa la chiave Alpha persistente."

      - name: Genera il changelog in italiano dalle modifiche reali
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_CHANNEL: Alpha
        run: python3 .github/scripts/generate_changelog.py

      - name: Carica gli artefatti della build
        uses: actions/upload-artifact@v4
        with:
          name: halimeo-${{ github.run_number }}-debug-apk
          path: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14

      - name: Pubblica la release Alpha dedicata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-build-${{ github.run_number }}
          name: HaliMeo Alpha ${{ github.run_number }} · v1.0.${{ github.run_number }}
          body_path: CHANGELOG.md
          prerelease: true
          make_latest: false
          files: |
            HaliMeo-*-build*-debug.apk
            CHANGELOG.md
