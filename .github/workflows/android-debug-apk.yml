name: Build HaliMeo debug APK

on:
  push:
    branches:
      - feature/ui-ux-refresh
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore Gradle task output cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-halimeo-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-halimeo-gradle-build-cache-
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --build-cache --parallel assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/*.apk HaliMeo-alpha-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halimeo-debug-apk
          path: HaliMeo-alpha-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-latest
          name: HaliMeo Alpha (latest)
          body: |
            Latest automatically built HaliMeo alpha debug APK from the feature/ui-ux-refresh branch.

            This is a prerelease build for testing. Install only if you understand it may contain bugs.
          prerelease: true
          make_latest: false
          files: HaliMeo-alpha-debug.apk
